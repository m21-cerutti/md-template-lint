name: Bug report
description: Report a wrong diagnostic, a crash or a behaviour that differs from the docs.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please keep the example minimal and remove any personal data.
        For questions, use GitHub Discussions instead.
  - type: input
    id: version
    attributes:
      label: md-template-lint version
      description: Output of `mdtl --version`.
      placeholder: 0.2.1
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.18.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config file
      description: Your `md-template-lint.yml`, reduced to the relevant pair.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: template
    attributes:
      label: Template
      description: Minimal template that shows the problem.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target Markdown file
      description: Minimal Markdown file linted against the template.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected the linter to report, or not to report.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of mdtl
      description: The full command and its output, with the exit code.
      render: text
    validations:
      required: true
