# Continuous integration (ADR 0005). Runs every quality gate of CONTRIBUTING.md on three
# operating systems and three Node versions. No secrets are used and none are needed.
#
# Actions are pinned by major version tag. Pinning by full commit SHA is a follow-up
# (ADR 0005, "Follow-ups").
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # engines.node is ">=22.18": 22.18 is the oldest supported version.
        node: ["22.18", "24", "26"]
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named by "packageManager" in package.json (no version input).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:parser
      # docs/syntax-reference.md matches the generator (pnpm run gen:syntax-doc)
      - run: pnpm run check:syntax-doc
      - run: pnpm run check:rules
      - run: pnpm run typecheck
      # eslint, markdownlint-cli2, ls-lint, secretlint (pnpm run lint)
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm run build

      # Packs, installs the tarball in a clean directory and runs the installed CLI.
      - name: Pack smoke test
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run smoke:pack
