version: 1

# Dogfood: this repository lints its own docs against its own templates.
# templates/ holds this repository's variants, templates/generic/ the reusable ones (pairs without a variant use those).
# Run `pnpm run build` then `node dist/cli.js` from the repository root.
#
# Intentionally unlisted docs (no template fits, or the file is not part of the repository):
#   - README.md: README.template.md requires last_updated frontmatter and H2s matched by position (Summary, Installation, Usage, etc.); README.md has owner-ordered sections and lacks last_updated, so MTL601 triggers.
#   - docs/spec.md: templates/generic/spec-technical.template.md expects Scope, Model,
#     Requirements, Interfaces and Errors and codes sections; the spec uses numbered sections.
#   - docs/README.md, tests/README.md: README.template.md expects Installation, Usage,
#     Development and License; these are index pages. tests/README.md has no frontmatter.
#   - docs/cli.md, docs/configuration.md, docs/grammar.md, docs/glossary.md, docs/guides/*.md:
#     reference and guide pages, no template exists for them (architecture.template.md
#     expects Overview, Legend and Discrepancies).
#   - docs/syntax-reference.md: generated by `pnpm run gen:syntax-doc`.
#   - docs/research/*.md: history notes, no template.
#   - PLAN_release-prep.md: working plan, no template.
#   - TODO.md, IDEA.md: local files not tracked by git (TODO.md also has no frontmatter).
#   - templates/**: they are the templates themselves.
pairs:
  - name: adr
    template: templates/generic/adr.template.md
    include: docs/adr/*.md
    exclude: "**/README.md"
    description: architecture decision records
  - name: architecture
    template: templates/architecture.template.md
    include: docs/architecture.md
    description: architecture overview
  - name: agents
    template: templates/generic/ai/AGENTS.template.md
    include: AGENTS.md
    description: project rules for AI agents
  - name: changelog
    template: templates/CHANGELOG.template.md
    include: CHANGELOG.md
    description: changelog
  - name: contributing
    template: templates/CONTRIBUTING.template.md
    include: CONTRIBUTING.md
    description: contribution guide
  - name: ai-guideline
    template: templates/AI_GUIDELINE.template.md
    include: AI_GUIDELINE.md
    description: AI-assisted development guideline
  - name: third-party-notices
    template: templates/THIRD_PARTY_NOTICES.template.md
    include: THIRD_PARTY_NOTICES.md
    description: third-party notices
  - name: ai-capabilities
    template: templates/generic/ai-capabilities.template.md
    include: docs/ai-capabilities.md
    description: AI capability inventory
