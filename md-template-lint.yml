version: 1

# Dogfood: this repository lints its own docs against its own templates.
# templates/generic/ holds the reusable templates, templates/ the project variants
# (CHANGELOG, README, research-note, spec-technical).
# Run `pnpm run build` then `node dist/cli.js` from the repository root.
#
# Intentionally unlisted docs (no template fits):
#   - docs/cli.md, docs/configuration.md, docs/grammar.md, docs/glossary.md, docs/guides/*.md:
#     reference and guide pages, no template exists for them (architecture.template.md
#     expects Overview, Legend and Discrepancies).
#   - docs/syntax-reference.md: generated by `pnpm run gen:syntax-doc`.
#   - PLAN_release-prep.md: working plan, no template.
#   - templates/**: they are the templates themselves (their INDEX.md is paired by `index`).
pairs:
  - name: adr
    template: templates/generic/adr.template.md
    include: docs/adr/*.md
    exclude: "**/README.md"
    description: architecture decision records

  - name: architecture
    template: templates/generic/architecture.template.md
    include: docs/architecture.md
    description: architecture overview

  - name: agents
    template: templates/generic/ai/AGENTS.template.md
    include: AGENTS.md
    description: project rules for AI agents

  - name: changelog
    template: templates/CHANGELOG.template.md
    include: CHANGELOG.md
    description: changelog

  - name: contributing
    template: templates/generic/CONTRIBUTING.template.md
    include: CONTRIBUTING.md
    description: contribution guide

  - name: ai-guideline
    template: templates/generic/AI_GUIDELINE.template.md
    include: AI_GUIDELINE.md
    description: AI-assisted development guideline

  - name: third-party-notices
    template: templates/generic/THIRD_PARTY_NOTICES.template.md
    include: THIRD_PARTY_NOTICES.md
    description: third-party notices

  - name: ideas
    template: templates/generic/IDEA.template.md
    include: IDEA.md
    description: ideas backlog

  - name: ai-capabilities
    template: templates/generic/ai-capabilities.template.md
    include: docs/ai-capabilities.md
    description: AI capability inventory

  - name: readme
    template: templates/README.template.md
    include: README.md
    description: project README

  - name: spec
    template: templates/spec-technical.template.md
    include: docs/spec.md
    description: technical specification

  - name: research
    template: templates/research-note.template.md
    include: docs/research/*.md
    description: research notes

  - name: todo
    template: templates/generic/TODO.template.md
    include: TODO.md
    description: task backlog

  - name: index
    template: templates/generic/INDEX.template.md
    include: "**/INDEX.md"
    exclude: "**/node_modules/"
    description: folder index pages
